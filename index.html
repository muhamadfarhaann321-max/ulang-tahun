<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selamat Ulang Tahun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b1020; --plum:#2e1a36; --rose:#ee6a86; --gold:#f4d9a6; --blush:#fdebe7; --ink:#0a0a0c;
  --ease:cubic-bezier(.22,.8,.24,1);--accrgb:238,106,134;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--gold);font-family:var(--sans)}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.page{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;
  transform:scale(.97) translateY(14px);filter:blur(10px);
  transition:opacity .9s var(--ease),transform 1.1s var(--ease),filter .9s var(--ease),visibility 0s .9s;
  padding:max(28px,env(safe-area-inset-top)) 22px 120px;scroll-behavior:smooth}
.page.active{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:.15s,.15s,.15s,0s}
.page.gone{transform:scale(1.03) translateY(-14px)}
.wrap{max-width:680px;margin:0 auto}
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1,h2{font-family:var(--serif);font-weight:500;line-height:1.1;color:var(--gold)}
h1{font-size:clamp(2.4rem,9vw,4rem);font-style:italic}
h2{font-size:clamp(2rem,7vw,3rem);font-style:italic;text-align:center;margin:18px 0 8px}
.sub{text-align:center;opacity:.75;margin-bottom:34px;font-size:.98rem}
p{line-height:1.85;font-size:1.04rem}

/* masuk bertahap */
.rv{opacity:0;transform:translateY(22px);transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
.active .rv,.rv.in{opacity:1;transform:none}
.active .rv{transition-delay:calc(var(--i,0)*140ms + 350ms)}
.page:not(.p-scroll) .rv.in{transition-delay:0s}

/* ---------- Halaman 1 ---------- */
.hint{margin-top:26px;font-size:.95rem;opacity:.7;animation:breathe 2.8s ease-in-out infinite}
.heart-btn{position:relative;width:min(70vw,300px);aspect-ratio:1;border:0;background:none;cursor:pointer;display:grid;place-items:center;outline-offset:10px}
.heart-btn svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 40px rgba(238,106,134,.55));animation:beat 1.9s ease-in-out infinite;transition:transform .5s var(--ease)}
.heart-btn:hover svg{transform:scale(1.07)}
.heart-btn.go svg{animation:none;transform:scale(14);opacity:0;transition:transform 1.3s var(--ease),opacity 1.1s ease .1s}
.ring{position:absolute;inset:8%;border-radius:50%;border:2px solid rgba(238,106,134,.5);animation:ring 3.2s ease-out infinite}
.ring:nth-child(2){animation-delay:1.05s}.ring:nth-child(3){animation-delay:2.1s}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.09)}28%{transform:scale(1)}42%{transform:scale(1.06)}70%{transform:scale(1)}}
@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes breathe{50%{opacity:.25}}

/* ---------- Halaman 2 ---------- */
.card{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(244,217,166,.22);
  border-radius:26px;padding:30px 26px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card p+p{margin-top:16px}
.wishes{list-style:none;margin-top:30px;display:grid;gap:12px}
.wishes li{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-radius:18px;background:rgba(238,106,134,.1);
  border:1px solid rgba(238,106,134,.25);transition:transform .5s var(--ease),background .5s}
.wishes li:hover{transform:translateX(6px);background:rgba(238,106,134,.18)}
.wishes i{font-style:normal;color:var(--rose);font-size:1.2rem;line-height:1.6}
.sign{font-family:var(--serif);font-style:italic;font-size:1.7rem;text-align:right;margin-top:26px;color:var(--rose)}

/* ---------- Foto & timeline ---------- */
.polaroid{background:#fff8f3;padding:12px 12px 16px;border-radius:6px;box-shadow:0 22px 50px -18px rgba(0,0,0,.7);color:#3a2230;
  transition:transform .8s var(--ease),box-shadow .8s var(--ease)}
.polaroid:hover{transform:rotate(0deg) scale(1.025)!important;box-shadow:0 30px 60px -16px rgba(0,0,0,.8)}
.ph{aspect-ratio:4/3;border-radius:3px;overflow:hidden;background:linear-gradient(135deg,#f6b3c1,#c9a7e6);display:grid;place-items:center;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.4s var(--ease)}
.polaroid:hover .ph img{transform:scale(1.06)}
.ph .empty{font-size:.8rem;color:#fff;text-align:center;padding:10px;opacity:.95}
.ph .empty b{display:block;font-size:2rem;margin-bottom:4px}
.polaroid h3{font-family:var(--serif);font-style:italic;font-size:1.5rem;margin:12px 4px 2px;color:#5b2740}
.polaroid p{font-size:.95rem;line-height:1.6;margin:0 4px;color:#5d4553}
.grid{display:grid;gap:34px;padding:0 6px}
.grid .polaroid:nth-child(odd){transform:rotate(-2deg)}
.grid .polaroid:nth-child(even){transform:rotate(2deg)}
.sv{transition:opacity 1.1s var(--ease),transform 1.3s var(--ease)}
.sv:not(.in){opacity:0;transform:translateY(46px)}
.polaroid.sv{transition:opacity 1.1s var(--ease),transform 1.3s var(--ease),box-shadow .8s var(--ease)}
.grid .polaroid.sv:not(.in){opacity:0;transform:translateY(54px) rotate(0)}
#p3{background:radial-gradient(120% 80% at 50% 0%,#4b2756,#2e1a36 55%,#1b1020)}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.grid .polaroid:nth-child(even){margin-top:50px}.wrap.wide{max-width:900px}}

.story{position:relative;display:grid;gap:44px;padding-left:34px}
.story::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--rose),rgba(244,217,166,.15))}
.chap{position:relative}
.chap::before{content:"";position:absolute;left:-33px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 6px rgba(238,106,134,.2)}
.chap h3{font-family:var(--serif);font-style:italic;font-size:1.8rem;margin-bottom:8px}
.chap .polaroid{margin-top:18px;transform:rotate(-1.2deg)}

/* ---------- Halaman Tentang Dia ---------- */
#pdia{background:radial-gradient(130% 55% at 50% 0%,rgba(var(--accrgb),.28),transparent 62%),#2e1a36}
.blk{margin:0 0 70px;text-align:center}
.bt{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.9rem;margin-bottom:22px}
.tiny{font-size:.85rem;opacity:.65;margin-top:10px}
.deck{position:relative;width:min(72vw,290px);aspect-ratio:4/5;margin:12px auto 34px;cursor:pointer;-webkit-user-select:none;user-select:none}
.dcard{position:absolute;inset:0;background:#fff8f3;padding:10px 10px 38px;border-radius:8px;box-shadow:0 26px 50px -20px rgba(0,0,0,.75);
  transition:transform 1s var(--ease),opacity .7s var(--ease)}
.dcard .ph{height:100%;aspect-ratio:auto}
.dh{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-style:normal;color:rgb(var(--accrgb));font-size:1.3rem;animation:beat 2.2s ease-in-out infinite}
.dq{font-family:var(--serif);font-style:italic;font-size:1.5rem;line-height:1.5;max-width:460px;margin:0 auto;min-height:4.6em;transition:opacity .35s,transform .35s var(--ease)}
.dq.out{opacity:0;transform:translateY(8px)}
.ddots{display:flex;justify-content:center;gap:8px;margin-top:6px}
.ddots i{width:7px;height:7px;border-radius:99px;background:rgba(244,217,166,.35);transition:width .6s var(--ease),background .6s}
.ddots i.cur{width:24px;background:rgb(var(--accrgb))}
.mrow{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap;margin-bottom:18px}
.vwrap{position:relative;width:150px;height:150px;flex:none}
.vinyl{position:absolute;inset:0;border-radius:50%;box-shadow:0 20px 40px -14px rgba(0,0,0,.8);
  background:radial-gradient(circle,#0c0c0f 0 12%,transparent 12.5%),repeating-radial-gradient(circle,#15151a 0 2px,#23232b 3px 4px);animation:spin 5s linear infinite;animation-play-state:paused}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent,rgba(255,255,255,.13),transparent 25%,transparent 50%,rgba(255,255,255,.13),transparent 75%)}
.vinyl span{position:absolute;inset:32%;border-radius:50%;background:rgb(var(--accrgb));display:grid;place-items:center;color:#fff;font-size:1.1rem}
.vwrap.on .vinyl{animation-play-state:running}
.arm{position:absolute;right:-8px;top:-8px;width:6px;height:96px;border-radius:4px;background:linear-gradient(#eee,#9a9a9a);transform-origin:50% 5px;transform:rotate(-30deg);transition:transform 1.3s var(--ease)}
.vwrap.on .arm{transform:rotate(10deg)}
.play{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border:0;border-radius:50%;background:rgba(255,255,255,.95);color:#2e1a36;font-size:1.1rem;cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .4s var(--ease)}
.play:hover{transform:scale(1.12)}
.mtxt{text-align:left}.mtxt h4{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.8rem;line-height:1.15}
.art{opacity:.75;font-size:.95rem;margin:2px 0 10px}
.eq{display:flex;gap:4px;align-items:flex-end;height:22px}
.eq i{width:4px;height:100%;border-radius:2px;background:rgb(var(--accrgb));transform-origin:bottom;transform:scaleY(.2);animation:eq 1s ease-in-out infinite paused}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.3s}
.on .eq i,#mini.on .eq i{animation-play-state:running}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.lnk{display:inline-block;margin-top:12px;color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(244,217,166,.5)}
#mini{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:6;width:44px;height:44px;border-radius:50%;border:1px solid rgba(244,217,166,.35);background:rgba(27,16,32,.7);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .6s var(--ease),transform .6s var(--ease)}
#mini.show{opacity:1;transform:none;pointer-events:auto}
#mini .eq{height:16px}#mini .eq i{width:3px}
.swatch{position:relative;overflow:hidden;display:block;width:100%;min-height:200px;border:0;border-radius:30px;cursor:pointer;padding:24px;
  background:linear-gradient(135deg,var(--c),var(--c2));color:var(--tc);box-shadow:0 30px 60px -28px var(--c);transition:transform .6s var(--ease),box-shadow .6s}
.swatch:hover{transform:scale(1.02)}
.swatch b{display:block;font-family:var(--serif);font-style:italic;font-weight:500;font-size:2.6rem;line-height:1.1;margin-top:46px}
.swatch small{display:block;margin-top:8px;opacity:.8;font-size:.92rem;transition:opacity .4s}
.swatch .rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);pointer-events:none}
.shades{display:flex;gap:8px;margin:16px 0 18px}
.shades div{flex:1;height:54px;border-radius:14px;display:grid;place-items:end center;padding-bottom:6px;font-size:.68rem;font-weight:600;letter-spacing:.02em}
.mean{max-width:460px;margin:0 auto}
.flower{display:flex;align-items:center;gap:18px;text-align:left;background:rgba(var(--accrgb),.1);border:1px solid rgba(var(--accrgb),.3);border-radius:26px;padding:20px 22px;margin-bottom:34px}
.flower .em{font-size:3.6rem;animation:float 4s ease-in-out infinite}
.flower h4{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.6rem}
.flower p{font-size:.96rem;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips span{padding:10px 20px;border-radius:99px;border:1px solid rgba(var(--accrgb),.55);background:rgba(var(--accrgb),.15);transition:transform .9s cubic-bezier(.3,1.5,.5,1),opacity .7s;transition-delay:calc(var(--k)*130ms + 300ms)}
.sv:not(.in) .chips span{transform:scale(.5);opacity:0}
.cta{border:0;border-radius:99px;padding:14px 30px;font:700 1rem var(--sans);color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff8fa6,#d63a63);box-shadow:0 14px 34px -12px rgba(238,106,134,.8);transition:transform .5s var(--ease)}
.cta:hover{transform:scale(1.06)}

/* ---------- Gulir untuk pindah: momen -> cerita ---------- */
#p3 .wrap{transform:translateY(calc(var(--pull,0)*-44px))}
.pullcue{display:grid;justify-items:center;gap:16px;margin:90px 0 60px;text-align:center}
.pullcue p{font-family:var(--serif);font-style:italic;font-size:1.35rem;opacity:.85}
.pullcue button{width:68px;height:68px;border:0;background:none;cursor:pointer;border-radius:50%;transition:transform .5s var(--ease)}
.pullcue button:hover{transform:scale(1.1)}
.pullcue svg{width:100%;height:100%;overflow:visible}
.pullcue .trk{fill:none;stroke:rgba(244,217,166,.25);stroke-width:2}
.pullcue .bar{fill:none;stroke:var(--rose);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transform:rotate(-90deg);transform-origin:32px 32px;filter:drop-shadow(0 0 6px rgba(238,106,134,.8))}
.pullcue .arr{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;animation:nudgeY 1.8s ease-in-out infinite}
@keyframes nudgeY{50%{transform:translateY(6px);opacity:.5}}
body.vslide .page.gone{transform:translateY(-14vh) scale(.95)}
body.vslide #p4:not(.active){transform:translateY(24vh) scale(.95);transition:none}

/* ---------- Gembok (akhir halaman cerita) ---------- */
.lockzone{min-height:100vh;display:grid;place-items:center;text-align:center;padding:90px 0 160px;position:relative}
.lockzone::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,rgba(244,217,166,.24),transparent 58%);opacity:var(--p,0);pointer-events:none}
.lockwrap{position:relative;max-width:420px;margin:0 auto;opacity:var(--p,0);transform:translateY(calc((1 - var(--p,0))*70px)) scale(calc(.8 + .2*var(--p,0)))}
.lockwrap h2{margin-top:0}
.lockwrap .tap{font-size:.92rem;opacity:.7;animation:breathe 2.8s ease-in-out infinite}
.lock{display:block;width:150px;margin:34px auto 14px;border:0;background:none;cursor:pointer;outline-offset:12px;
  filter:drop-shadow(0 18px 40px rgba(244,217,166,.35));animation:float 4s ease-in-out infinite,glow 4s ease-in-out infinite}
.lock svg{display:block;width:100%;overflow:visible}
.lock .shackle{transform-origin:116px 92px;transition:transform 1.1s var(--ease)}
.lock .keyhole{transition:opacity .6s}
.lock:hover{transform:scale(1.05)}
.lock.open{animation:none;filter:drop-shadow(0 0 70px rgba(244,217,166,.95));transition:filter 1s}
.lock.open .shackle{transform:translateY(-22px) rotate(30deg)}
.lock.nudge{animation:shake .6s}
@keyframes glow{50%{filter:drop-shadow(0 18px 64px rgba(244,217,166,.7))}}

/* ---------- Papan kode ---------- */
.pad{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(10,5,14,.62);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:opacity .6s var(--ease),visibility 0s .6s}
.pad.on{opacity:1;visibility:visible;transition-delay:0s}
.padcard{position:relative;width:min(92vw,340px);text-align:center;padding:30px 24px 26px;border-radius:30px;
  background:linear-gradient(165deg,rgba(60,32,70,.95),rgba(27,16,32,.95));border:1px solid rgba(244,217,166,.3);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 80px -30px rgba(238,106,134,.5);
  transform:translateY(30px) scale(.92);opacity:0;transition:transform .9s var(--ease),opacity .7s var(--ease)}
.pad.on .padcard{transform:none;opacity:1;transition-delay:.08s}
.padcard h3{font-family:var(--serif);font-style:italic;font-size:1.9rem;font-weight:500}
.padmsg{font-size:.88rem;opacity:.75;min-height:1.4em;margin:4px 0 20px;line-height:1.4;transition:color .4s}
.x{position:absolute;right:14px;top:12px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.07);color:var(--gold);font-size:1.2rem;cursor:pointer;transition:background .3s,transform .4s var(--ease)}
.x:hover{background:rgba(255,255,255,.16);transform:rotate(90deg)}
.pins{display:flex;justify-content:center;gap:13px;margin-bottom:26px}
.pins i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(244,217,166,.6);transition:background .35s var(--ease),transform .45s cubic-bezier(.3,1.8,.5,1),box-shadow .4s,border-color .4s}
.pins i.f{background:var(--gold);transform:scale(1.25);box-shadow:0 0 16px rgba(244,217,166,.7)}
.pad.bad .pins{animation:shake .6s}
.pad.bad .pins i.f{background:#ff6b7f;border-color:#ff6b7f;box-shadow:0 0 16px rgba(255,107,127,.8)}
.pad.bad .padmsg{color:#ff9aa8;opacity:1}
.pad.ok .pins i{background:#b9f0c4;border-color:#b9f0c4;box-shadow:0 0 18px rgba(185,240,196,.8);transform:scale(1.3)}
.pad.ok .padmsg{color:#b9f0c4;opacity:1}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-items:center}
.keys button{width:66px;height:66px;border-radius:50%;border:1px solid rgba(244,217,166,.22);background:rgba(255,255,255,.06);color:var(--gold);
  font:600 1.5rem var(--sans);cursor:pointer;transition:transform .35s var(--ease),background .35s,box-shadow .35s}
.keys button:hover{background:rgba(244,217,166,.15)}
.keys button:active{transform:scale(.88);background:rgba(238,106,134,.45);box-shadow:0 0 24px rgba(238,106,134,.6)}
.keys .ghost{visibility:hidden}

/* ---------- Halaman 5 ---------- */
#p5{background:radial-gradient(circle at 50% 30%,#fff6f2,var(--blush) 55%,#f6c9cf)}
#p5 h2{color:var(--ink)}#p5 .sub{color:#4a2a38}
.gift{width:min(66vw,280px);border:0;background:none;cursor:pointer;outline-offset:10px;position:relative}
.gift svg{width:100%;display:block;overflow:visible;animation:float 3.6s ease-in-out infinite}
.gift .lid{transform-origin:50% 100%;transform-box:fill-box;transition:transform .9s var(--ease)}
.gift.shake svg{animation:shake .7s ease-in-out}
.gift.open svg{animation:none}
.gift.open .lid{transform:translateY(-46px) rotate(-16deg)}
.gift.open .qm{opacity:0;transition:opacity .4s}
.gift .shadow{position:absolute;left:12%;right:12%;bottom:-14px;height:18px;border-radius:50%;background:rgba(0,0,0,.18);filter:blur(8px);animation:sh 3.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
@keyframes sh{50%{transform:scale(.8);opacity:.6}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
.reveal{max-width:480px;margin-top:30px;background:#fff;border-radius:22px;padding:26px;color:#4a2a38;box-shadow:0 24px 60px -24px rgba(120,30,60,.5);
  opacity:0;transform:translateY(24px) scale(.96);pointer-events:none;transition:opacity 1s var(--ease),transform 1.1s var(--ease);position:absolute;visibility:hidden}
.reveal.show{opacity:1;transform:none;pointer-events:auto;position:relative;visibility:visible}
.reveal h3{font-family:var(--serif);font-style:italic;font-size:1.9rem;color:#b8334f;margin-bottom:8px}
.again{margin-top:18px;border:0;background:var(--rose);color:#fff;font:600 .95rem var(--sans);padding:10px 22px;border-radius:99px;cursor:pointer;transition:transform .4s var(--ease)}
.again:hover{transform:scale(1.06)}

/* ---------- Navigasi ---------- */
nav{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:center;align-items:center;gap:16px;
  opacity:0;transform:translateY(20px);pointer-events:none;transition:opacity .8s var(--ease),transform .8s var(--ease)}
nav.on{opacity:1;transform:none;pointer-events:auto}
.arrow{width:46px;height:46px;border-radius:50%;border:1px solid rgba(244,217,166,.4);background:rgba(27,16,32,.7);color:var(--gold);font-size:1.2rem;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .4s var(--ease),opacity .4s,background .4s}
.arrow:hover{transform:scale(1.1);background:var(--rose);color:#fff}
.arrow[disabled]{opacity:.25;pointer-events:none}

const $=(s,r=document)=>r.querySelector(s), app=$('#app');
const C=CONFIG;
let ACC=[238,106,134],TGT=[238,106,134];
const heartPath="M100 178C44 134 12 100 12 62 12 36 32 18 56 18c18 0 34 10 44 26C110 28 126 18 144 18c24 0 44 18 44 44 0 38-32 72-88 116z";

function photo(src,i){
  const ph=document.createElement('div');ph.className='ph';
  const img=new Image();img.alt='';img.loading='lazy';
  if(src.startsWith('data:')){img.onerror=()=>{img.remove();ph.innerHTML='<div class="empty"><b>♡</b>Foto gagal dimuat</div>'};img.src=src;ph.appendChild(img);return ph}
  const base=src.replace(/\.[^./]+$/,''),first=(src.match(/\.([^./]+)$/)||[])[1]||'jpg';
  const tries=[...new Set([first,'jpg','jpeg','png','webp','JPG','JPEG','PNG'])].map(x=>base+'.'+x);
  let k=0;
  img.onerror=()=>{if(++k<tries.length){img.src=tries[k]}else{img.remove();ph.innerHTML='<div class="empty"><b>♡</b>Taruh foto di<br>'+src+'</div>'}};
  img.src=tries[0];ph.appendChild(img);return ph;
}
function polaroid(d,cls=''){
  const el=document.createElement('figure');el.className='polaroid '+(cls==='bare'?'':'sv ')+cls;
  el.appendChild(photo(d.foto));
  if(d.judul){el.insertAdjacentHTML('beforeend',`<h3>${d.judul}</h3>`)}
  if(d.teks&&cls!=='bare'){el.insertAdjacentHTML('beforeend',`<p>${d.teks}</p>`)}
  return el;
}
const rv=(i)=>`class="rv" style="--i:${i}"`;

function addPage(id,html,extra=''){
  const s=document.createElement('section');s.className='page '+extra;s.id=id;s.innerHTML=html;app.appendChild(s);pages.push(s);return s;
}

        <path d="${heartPath}" fill="url(#hg)"/>

    <div class="sign rv" style="--i:9">${u.penutup}, ${C.dari}</div>

/* --- Halaman Tentang Dia --- */
const D=C.dia,M=D.musik,WR=D.warna;
const pdia=addPage('pdia',`

/* tumpukan foto */
(()=>{
  const deck=$('#deck'),dq=$('#dq'),dd=$('#ddots');let top=0,flying=false;
  const cards=D.foto.map(f=>{

    c.insertAdjacentHTML('beforeend','<i class="dh">♥</i>');deck.appendChild(c);dd.appendChild(document.createElement('i'));return c;
  });
  const T=['translate(0,0) rotate(-1deg) scale(1)','translate(16px,12px) rotate(5deg) scale(.95)','translate(-16px,20px) rotate(-6deg) scale(.9)'];
  const quote=()=>{dq.classList.add('out');setTimeout(()=>{dq.textContent='“'+D.foto[top].kata+'”';dq.classList.remove('out')},350)};
  function layout(){
    cards.forEach((c,i)=>{const pos=(i-top+cards.length)%cards.length;c.style.zIndex=10-pos;c.style.transform=T[Math.min(pos,2)];c.style.opacity=1});
    [...dd.children].forEach((d,i)=>d.classList.toggle('cur',i===top));quote();
  }
  deck.onclick=()=>{
    if(flying)return;flying=true;const c=cards[top];
    c.style.transform='translate(130%,-8%) rotate(24deg)';c.style.opacity='0';

/* musik */
const audio=new Audio(),vwrap=$('#vwrap'),mini=$('#mini'),mnote=$('#mnote');
let playing=false,ft;
if(M.audio){audio.src=M.audio;audio.loop=true;audio.preload='auto';audio.volume=0}
function fade(to,ms,done){clearInterval(ft);const from=audio.volume,t0=performance.now();
  ft=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);audio.volume=Math.max(0,Math.min(1,from+(to-from)*k));if(k>=1){clearInterval(ft);done&&done()}},30)}
function setPlaying(v){playing=v;vwrap.classList.toggle('on',v);document.querySelector('.mrow').classList.toggle('on',v);mini.classList.toggle('on',v);$('#play').textContent=v?'❚❚':'▶'}
async function toggleMusic(){
  if(!M.audio||audio.error){mnote.textContent=M.link?'Lagunya belum ada di file ini. Dengarkan lewat tautan di atas.':'Lagunya belum ditambahkan ke file ini.';return}
  if(playing){setPlaying(false);fade(0,600,()=>audio.pause())}
  else{try{await audio.play();setPlaying(true);mini.classList.add('show');fade(.85,1400);mnote.textContent=''}catch(e){mnote.textContent='Lagu tidak bisa diputar di perangkat ini.'}}
}
function stopMusic(){clearInterval(ft);audio.pause();audio.currentTime=0;audio.volume=0;setPlaying(false);mini.classList.remove('show')}
$('#play').onclick=toggleMusic;mini.onclick=toggleMusic;

/* warna */
const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]};
const mixc=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const toHex=r=>'#'+r.map(v=>v.toString(16).padStart(2,'0')).join('');
const lumOf=r=>(.299*r[0]+.587*r[1]+.114*r[2])/255;
(()=>{
  const base=hex2rgb(WR.hex),sw=$('#swatch'),W_=[255,255,255],K_=[0,0,0];
  sw.style.setProperty('--c',WR.hex);sw.style.setProperty('--c2',toHex(mixc(base,K_,.3)));
  sw.style.setProperty('--tc',lumOf(base)>.62?'#2a1320':'#fff');
  [mixc(base,W_,.78),mixc(base,W_,.45),base,mixc(base,K_,.28),mixc(base,K_,.5)].forEach(r=>{
    const d=document.createElement('div');d.style.background=toHex(r);d.style.color=lumOf(r)>.6?'#2a1320':'#fff';d.textContent=toHex(r).toUpperCase();$('#shades').appendChild(d);
  });
  sw.onclick=ev=>{
    const b=sw.getBoundingClientRect(),x=ev.clientX-b.left,y=ev.clientY-b.top,sz=Math.hypot(b.width,b.height)*2;
    const rp=document.createElement('span');rp.className='rp';rp.style.cssText=`left:${x-sz/2}px;top:${y-sz/2}px;width:${sz}px;height:${sz}px`;sw.appendChild(rp);
    rp.animate([{transform:'scale(0)',opacity:.6},{transform:'scale(1)',opacity:0}],{duration:1200,easing:'cubic-bezier(.2,.7,.2,1)'}).onfinish=()=>rp.remove();
    TGT=base.slice();$('#swsub').textContent='Dunia jadi lebih berwarna ♥';
    burst(ev.clientX,ev.clientY,[WR.hex,toHex(mixc(base,W_,.5)),'#ffffff'],60,'heart');
  };
})();

/* --- navigasi --- */
const nav=$('#nav'),dots=$('#dots'),prev=$('#prev'),next=$('#next');
let cur=0,busy=false;
pages.forEach((_,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Halaman '+(i+1));b.onclick=()=>go(i);dots.appendChild(b)});

let unlocked=false;
const lock=$('#lock'),lz=$('#lockzone');
function swap(n){
  parts = []; // Bersihkan sisa confetti/partikel saat berpindah halaman
  const old=pages[cur];old.classList.remove('active');old.classList.add('gone');
  setTimeout(()=>old.classList.remove('gone'),1000);
  cur=n;const pg=pages[cur];pg.scrollTop=0;
  pg.classList.add('active');
  nav.classList.toggle('on',cur>0);
  nav.classList.toggle('light',cur===5);
  [...dots.children].forEach((d,i)=>d.classList.toggle('cur',i===cur));
  prev.disabled=cur===0;next.disabled=cur===pages.length-1;
  closePad();setPull(0);
  if(cur===5)resetGift();
  if(cur===0){resetLock();stopMusic()}
}
function go(n){
  if(busy||n===cur||n<0||n>=pages.length)return;
  if(n===5&&!unlocked){                      /* penutup terkunci sampai kode benar */
    if(cur!==4){go(4);setTimeout(scrollToLock,1100)}else{scrollToLock();nudge()}
    return;
  }
  busy=true;
  if(cur===3&&n===4){slideTransition(n);setTimeout(()=>busy=false,1700);return}
  if(cur===1&&n===2){heartTransition(()=>swap(n));setTimeout(()=>busy=false,2700);return}
  swap(n);
  setTimeout(()=>busy=false,900);
}
prev.onclick=()=>go(cur-1);
next.onclick=()=>{
  if(cur===4&&!unlocked){lz.getBoundingClientRect().top<H*.55?openPad():scrollToLock();return}
  go(cur+1);
};
addEventListener('keydown',ev=>{
  if(pad.classList.contains('on')){
    if(/^\d$/.test(ev.key))press(ev.key);
    else if(ev.key==='Backspace')del();
    else if(ev.key==='Escape')closePad();
    return;
  }
  if(cur===0)return;
  if(ev.key==='ArrowRight')next.onclick();
  if(ev.key==='ArrowLeft')go(cur-1);
});

/* --- transisi hati: laman ucapan -> laman momen --- */
function heartTransition(mid){
  const K=Math.max(W,H)*3.6/200;
  const mk=(fill,delay)=>{
    const d=document.createElement('div');
    d.style.cssText=`position:fixed;left:${W/2-100}px;top:${H/2-92}px;width:200px;height:190px;z-index:8;pointer-events:none;transform-origin:50% 48%;transform:scale(.03)`;
    d.innerHTML=`<svg viewBox="0 0 200 190" width="200" height="190" style="display:block"><path d="${heartPath}" fill="${fill}"/></svg>`;
    document.body.appendChild(d);
    d.animate([{transform:'scale(.03)'},{transform:`scale(${K})`}],{duration:1700,delay,easing:'cubic-bezier(.7,0,.25,1)',fill:'forwards'});
    return d;
  };
  const a=mk('#ee6a86',0),b=mk('#2e1a36',150);
  burst(W/2,H/2,['#ff8fa6','#f4d9a6','#ffffff'],60,'heart');
  setTimeout(mid,1400);
  setTimeout(()=>[a,b].forEach(o=>{o.animate([{opacity:1},{opacity:0}],{duration:900,easing:'ease',fill:'forwards'}).onfinish=()=>o.remove()}),1550);
}

/* --- gulir: laman momen -> laman cerita --- */
const p3el=pages[3],pbar=$('#pullbar');
let pull=0,pullT,relaxing=false;
function setPull(v){pull=Math.max(0,Math.min(1,v));p3el.style.setProperty('--pull',pull.toFixed(3));pbar.style.strokeDashoffset=(1-pull).toFixed(3)}
const atBottom=()=>p3el.scrollTop+p3el.clientHeight>=p3el.scrollHeight-4;
function relax(){if(relaxing)return;relaxing=true;(function f(){if(pull<=0.002||cur!==3){relaxing=false;setPull(0);return}setPull(pull-.025);requestAnimationFrame(f)})()}
function maybeGo(){if(pull>=1&&cur===3&&!busy){go(4)}}
p3el.addEventListener('wheel',ev=>{
  if(cur!==3||busy)return;
  if(ev.deltaY>0&&atBottom()){setPull(pull+ev.deltaY/380);clearTimeout(pullT);pullT=setTimeout(relax,450);maybeGo()}
  else if(ev.deltaY<0&&pull>0){setPull(0)}
},{passive:true});
let pty=0;
p3el.addEventListener('touchstart',e=>{pty=e.touches[0].clientY},{passive:true});
p3el.addEventListener('touchmove',e=>{
  if(cur!==3||busy)return;
  const y=e.touches[0].clientY;
  if(!atBottom()){pty=y;return}
  setPull((pty-y)/170);maybeGo();
},{passive:true});
p3el.addEventListener('touchend',()=>{if(cur===3&&pull<1)relax()},{passive:true});
$('#pullbtn').onclick=()=>{if(cur===3)go(4)};
addEventListener('keydown',ev=>{if(cur===3&&(ev.key==='ArrowDown'||ev.key==='PageDown'||ev.key===' ')&&atBottom()){setPull(pull+.34);clearTimeout(pullT);pullT=setTimeout(relax,700);maybeGo()}});

function slideTransition(n){
  document.body.classList.add('vslide');void document.body.offsetWidth;
  swap(n);
  const sw=document.createElement('div');
  sw.style.cssText='position:fixed;left:0;right:0;top:0;height:70vh;z-index:7;pointer-events:none;background:linear-gradient(to top,transparent,rgba(244,217,166,.2) 40%,rgba(238,106,134,.2) 62%,transparent)';
  document.body.appendChild(sw);
  sw.animate([{transform:'translateY(100vh)'},{transform:'translateY(-75vh)'}],{duration:1600,easing:'cubic-bezier(.5,0,.2,1)'}).onfinish=()=>sw.remove();
  burst(W/2,H*.85,['#f4d9a6','#ff8fa6','#ffffff'],36,'heart');
  setTimeout(()=>document.body.classList.remove('vslide'),1600);
}

/* --- gembok & kode: laman cerita -> laman penutup --- */
const pad=$('#pad'),pins=[...pad.querySelectorAll('.pins i')],padmsg=$('#padmsg');
let buf='',inputLocked=false;
const scrollToLock=()=>lz.scrollIntoView({behavior:'smooth',block:'center'});
const nudge=()=>{lock.classList.remove('nudge');void lock.offsetWidth;lock.classList.add('nudge')};
function paint(){pins.forEach((p,i)=>p.classList.toggle('f',i<buf.length))}
function openPad(){if(unlocked)return;buf='';inputLocked=false;paint();padmsg.textContent=C.penutup.petunjuk||'';pad.classList.remove('bad','ok');pad.classList.add('on');pad.setAttribute('aria-hidden','false')}
function closePad(){pad.classList.remove('on');pad.setAttribute('aria-hidden','true')}
function press(d){
  if(inputLocked||buf.length>=6)return;
  buf+=d;paint();navigator.vibrate&&navigator.vibrate(8);
  if(buf.length===6){inputLocked=true;setTimeout(check,330)}
}
function del(){if(inputLocked)return;buf=buf.slice(0,-1);paint()}
function check(){
  if(buf===String(C.penutup.kode)){
    pad.classList.add('ok');padmsg.textContent='Kodenya benar ♥';
    setTimeout(()=>{closePad();unlock()},1000);
  }else{
    pad.classList.add('bad');padmsg.textContent='Kodenya belum tepat, coba lagi';
    navigator.vibrate&&navigator.vibrate([40,40,40]);
    setTimeout(()=>{pad.classList.remove('bad');padmsg.textContent=C.penutup.petunjuk||'';buf='';paint();inputLocked=false},800);
  }
}
$('#keys').addEventListener('click',ev=>{const b=ev.target.closest('button[data-k]');if(!b)return;b.dataset.k==='del'?del():press(b.dataset.k)});
$('#padx').onclick=closePad;
pad.addEventListener('click',ev=>{if(ev.target===pad)closePad()});
lock.onclick=openPad;

function unlock(){
  busy=true;scrollToLock();
  setTimeout(()=>{
    lock.classList.add('open');unlocked=true;
    const r=lock.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height*.45,['#f4d9a6','#ffffff','#ee6a86','#e7b873'],100,'conf');
  },750);
  setTimeout(bloom,2100);
}
function bloom(){
  const r=lock.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,K=Math.max(W,H)*3/200;
  const d=document.createElement('div');
  d.style.cssText=`position:fixed;left:${cx-100}px;top:${cy-100}px;width:200px;height:200px;border-radius:50%;z-index:8;pointer-events:none;transform:scale(.05);background:radial-gradient(circle,#ffffff 0,#fdebe7 55%)`;
  document.body.appendChild(d);
  d.animate([{transform:'scale(.05)'},{transform:`scale(${K})`}],{duration:1300,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'});
  setTimeout(()=>{busy=false;go(5)},1100);
  setTimeout(()=>{d.animate([{opacity:1},{opacity:0}],{duration:1100,easing:'ease',fill:'forwards'}).onfinish=()=>d.remove()},1350);
}
function resetLock(){lock.classList.remove('open','nudge');unlocked=false;inputLocked=false;buf='';paint()}

/* gembok muncul perlahan mengikuti gulir */
let tick=false;
pages[4].addEventListener('scroll',()=>{
  if(tick)return;tick=true;
  requestAnimationFrame(()=>{
    tick=false;
    const r=lz.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,1-(r.top-H*.15)/(H*.65)));
    lz.style.setProperty('--p',p.toFixed(3));
  });
},{passive:true});

/* geser di layar sentuh */
let tx=0,ty=0;
addEventListener('touchstart',ev=>{tx=ev.touches[0].clientX;ty=ev.touches[0].clientY},{passive:true});
addEventListener('touchend',ev=>{if(cur===0)return;const dx=ev.changedTouches[0].clientX-tx,dy=ev.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)go(cur+(dx<0?1:-1))},{passive:true});

/* muncul saat di-scroll (halaman momen & cerita) */
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.15});
[pdia,p3,p4].forEach(p=>{
  const watch=()=>p.querySelectorAll('.sv').forEach(x=>{x.classList.remove('in');io.observe(x)});
  new MutationObserver(watch).observe(p,{attributes:true,attributeFilter:['class']});
  watch();
});

/* --- hati diklik --- */
$('#heart').onclick=function(){
  if(this.classList.contains('go'))return;
  this.classList.add('go');
  const r=this.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,['#ff8fa6','#ee6a86','#f4d9a6','#fff'],70,'heart');
  setTimeout(()=>{go(1);setTimeout(()=>$('#heart').classList.remove('go'),1200)},900);
};

/* --- kado --- */
const gift=$('#gift'),reveal=$('#reveal');
function resetGift(){gift.classList.remove('open','shake');reveal.classList.remove('show')}
gift.onclick=()=>{
  if(gift.classList.contains('open'))return;
  gift.classList.add('shake');
  setTimeout(()=>{
    gift.classList.remove('shake');gift.classList.add('open');
    const r=gift.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height*.3,['#ee6a86','#f4d9a6','#b8334f','#ffffff','#c9a7e6'],140,'conf');
    setTimeout(()=>reveal.classList.add('show'),500);
  },700);
};
$('#again').onclick=()=>{go(0)};

/* --- latar: hati melayang halus & sistem efek partikel --- */
const bg=$('#bg'),bx=bg.getContext('2d');let W,H,DPR;
function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  for(const cv of [bg,fx]){cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px'}
  bx.setTransform(DPR,0,0,DPR,0,0);fxc.setTransform(DPR,0,0,DPR,0,0)}
const fx=$('#fx'),fxc=fx.getContext('2d');
function heartShape(x,ctx,cx,cy,s){const p=new Path2D(heartPath);ctx.save();ctx.translate(cx-100*s,cy-95*s);ctx.scale(s,s);ctx.fill(p);ctx.restore()}
const floaters=Array.from({length:22},()=>({x:Math.random(),y:Math.random(),s:.05+Math.random()*.12,v:.015+Math.random()*.035,ph:Math.random()*6.28,a:.05+Math.random()*.13}));
let last=performance.now(),parts=[];

function frame(t){
  const dt=Math.min((t-last)/16.67,3);last=t;
  bx.clearRect(0,0,W,H);
  if(Math.abs(TGT[0]-ACC[0])+Math.abs(TGT[1]-ACC[1])+Math.abs(TGT[2]-ACC[2])>.6){
    ACC=ACC.map((v,i)=>v+(TGT[i]-v)*.045*Math.min(dt,2));
    document.documentElement.style.setProperty('--accrgb',ACC.map(Math.round).join(','));
  }
  const ac=ACC.map(Math.round).join(',');
  const light=cur===5;
  floaters.forEach(f=>{
    f.y-=f.v*dt*.01;if(f.y<-.1){f.y=1.1;f.x=Math.random()}
    bx.fillStyle=light?`rgba(${ac},${f.a*.8})`:`rgba(${ac},${f.a})`;
    heartShape(0,bx,(f.x+Math.sin(t/1800+f.ph)*.02)*W,f.y*H,f.s*(W<600?.8:1.1));
  });

  fxc.clearRect(0,0,W,H);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.vy+=.18*dt;p.vx*=.98;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
    p.life-=(p.t==='conf'?.018:.012)*dt;
    fxc.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));fxc.fillStyle=p.c;
    if(p.t==='heart'){heartShape(0,fxc,p.x,p.y,p.s)}
    else{fxc.save();fxc.translate(p.x,p.y);fxc.rotate(p.r);fxc.fillRect(-p.s*40,-p.s*20,p.s*80,p.s*40);fxc.restore()}
  });
  fxc.globalAlpha=1;
  requestAnimationFrame(frame);
}

function burst(x,y,cols,n,type){
  if(parts.length>150)parts=parts.slice(-50);
  for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=3+Math.random()*8;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(type==='conf'?5:2),s:.03+Math.random()*.06,r:Math.random()*6,vr:(Math.random()-.5)*.35,
      c:cols[i%cols.length],life:1,t:type})}
}
addEventListener('resize',size);size();requestAnimationFrame(frame);
pages[0].classList.add('active');
</script>
</body>
